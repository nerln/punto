name: Build and test macOS preview

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    # macos-15 is the standard arm64 label; macos-15-arm64 names the image.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Inspect build environment
        shell: bash
        run: |
          test "$(uname -m)" = "arm64"
          swift --version
          xcodebuild -version

      - name: Run tests without changing display modes
        run: swift test

      - name: Package ad-hoc signed preview
        run: ./scripts/package-release.sh 0.1.0

      - name: Upload preview and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Punto-0.1.0-macOS-arm64
          path: |
            build/Punto-0.1.0-macOS-arm64.zip
            build/Punto-0.1.0-macOS-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
